name: Publish

# npm and Homebrew for a version that already has a GitHub Release. The release workflow calls
# this after creating the release. Run it by hand to (re)publish a version, e.g. after adding a
# missing secret:   gh workflow run publish.yml -f version=0.2.0
# Both jobs skip what is already published, so re-running is safe.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      NPM_TOKEN:
        required: false
      HOMEBREW_TAP_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Version with an existing GitHub Release, e.g. 0.2.0
        required: true
      channels:
        description: Where to publish
        type: choice
        options: [all, npm, homebrew]
        default: all

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  VERSION: ${{ inputs.version }}

jobs:
  npm:
    name: npm
    if: inputs.channels != 'homebrew'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set; skipping npm (see docs/releasing.md)"
            exit 0
          fi
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          if npm view "ngobe@$VERSION" version >/dev/null 2>&1; then
            echo "ngobe@$VERSION is already on npm"
            exit 0
          fi
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"

  homebrew:
    name: Homebrew tap
    if: inputs.channels != 'npm' && !contains(inputs.version, '-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Update Formula/ngobe.rb in ngobe-ai/homebrew-tap
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping Homebrew (see docs/releasing.md)"
            exit 0
          fi
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir dist-bin --clobber
          bun scripts/homebrew-formula.ts "$VERSION" dist-bin/SHA256SUMS > ngobe.rb
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/ngobe-ai/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp ngobe.rb tap/Formula/ngobe.rb
          cd tap
          git add Formula/ngobe.rb
          if git diff --cached --quiet; then
            echo "Formula/ngobe.rb is already at $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "ngobe $VERSION"
          git push
