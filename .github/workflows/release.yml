name: Release

# Push a tag like v0.3.0 (npm version minor && git push --follow-tags) to publish:
# standalone binaries + SHA256SUMS on GitHub Releases, then npm and Homebrew (publish.yml).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.14"

jobs:
  check:
    name: Tag matches package.json
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          case "$pkg" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: [check, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest, runs: true }
          - { target: linux-x64-baseline, runner: ubuntu-latest, runs: true }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, runs: true }
          - { target: darwin-arm64, runner: macos-latest, runs: true }
          # Built on Apple Silicon (so it is signed); there is no Intel runner to run it on.
          - { target: darwin-x64, runner: macos-latest, runs: false }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-binaries.ts ${{ matrix.target }}
      - name: Run it
        if: matrix.runs
        run: test "$(dist-bin/ngobe-${{ matrix.target }}/ngobe --version)" = "${{ needs.check.outputs.version }}"
      - name: Check the code signature
        if: runner.os == 'macOS'
        run: codesign --verify --verbose dist-bin/ngobe-${{ matrix.target }}/ngobe
      - uses: actions/upload-artifact@v7
        with:
          name: ngobe-${{ matrix.target }}
          path: dist-bin/ngobe-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  github:
    name: GitHub Release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ngobe-*
          path: dist-bin
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist-bin
          sha256sum ngobe-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "ngobe ${{ needs.check.outputs.version }}" --generate-notes --verify-tag)
          if [ "${{ needs.check.outputs.prerelease }}" = true ]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist-bin/ngobe-*.tar.gz dist-bin/SHA256SUMS install.sh "${args[@]}"

  publish:
    name: npm and Homebrew
    needs: [check, github]
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.check.outputs.version }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  verify:
    name: Install from the release (${{ matrix.os }})
    needs: [check, github]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: curl | sh, exactly as users will
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/install.sh" | NGOBE_VERSION="${{ needs.check.outputs.version }}" sh
          test "$("$HOME/.local/bin/ngobe" --version)" = "${{ needs.check.outputs.version }}"
